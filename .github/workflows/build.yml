name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project
        run: |
          set -e
          mkdir -p proj/app/src/main/java/ir/dollar/pill proj/app/src/main/res/layout proj/app/src/main/res/drawable proj/app/src/main/res/xml proj/app/src/main/assets
          F=$(ls *.ttf 2>/dev/null | head -1 || true)
          if [ -n "$F" ]; then cp "$F" proj/app/src/main/assets/font.ttf; else echo "no .ttf font in repo root"; fi
          cd proj

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'DollarPill'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ir.dollar.pill'
              compileSdk 34
              defaultConfig {
                  applicationId 'ir.dollar.pill'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="قرص دلار" android:icon="@drawable/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".DollarWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="40dp"
              android:targetCellWidth="4"
              android:targetCellHeight="1"
              android:updatePeriodMillis="0"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:initialLayout="@layout/widget" />
          EOF

          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="40dp"
                  android:layout_gravity="center"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:layoutDirection="ltr"
                  android:background="@drawable/pill"
                  android:paddingStart="5dp"
                  android:paddingEnd="16dp">

                  <ImageView
                      android:id="@+id/refresh"
                      android:layout_width="30dp"
                      android:layout_height="30dp"
                      android:layout_marginEnd="10dp"
                      android:padding="6dp"
                      android:background="@drawable/btn"
                      android:contentDescription="ریفرش"
                      android:src="@drawable/ic_refresh" />

                  <ImageView
                      android:id="@+id/txt"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content" />
              </LinearLayout>
          </FrameLayout>
          EOF

          cat > app/src/main/res/drawable/pill.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="315" android:startColor="#59FFFFFF" android:endColor="#1AFFFFFF" />
              <corners android:radius="60dp" />
              <stroke android:width="1dp" android:color="#80FFFFFF" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/btn.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#26FFFFFF" />
              <stroke android:width="1dp" android:color="#80FFFFFF" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_refresh.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#0B4F52" android:pathData="M0,0h48v48h-48z" />
              <path android:fillColor="#FFFFFF" android:pathData="M24,10a14,14 0 1,0 0,28a14,14 0 1,0 0,-28z" />
          </vector>
          EOF

          cat > app/src/main/java/ir/dollar/pill/MainActivity.java <<'EOF'
          package ir.dollar.pill;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Toast.makeText(this, "ویجت «قرص دلار» را از لیست ویجت‌ها اضافه کنید", Toast.LENGTH_LONG).show();
                  // آیکن برنامه بعد از اولین باز شدن از لانچر پنهان می‌شود؛ ویجت سر جایش می‌ماند
                  getPackageManager().setComponentEnabledSetting(
                          new ComponentName(this, MainActivity.class),
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                          PackageManager.DONT_KILL_APP);
                  finish();
              }
          }
          EOF

          cat > app/src/main/java/ir/dollar/pill/DollarWidget.java <<'EOF'
          package ir.dollar.pill;

          import android.app.PendingIntent;
          import android.app.WallpaperColors;
          import android.app.WallpaperManager;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.widget.RemoteViews;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class DollarWidget extends AppWidgetProvider {
              static final String REFRESH = "ir.dollar.pill.REFRESH";
              static final String API = "https://jeylgqlxmjumjfzzgbfa.supabase.co/functions/v1/dollar";
              static final String KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpleWxncWx4bWp1bWpmenpnYmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2NTE0MTUsImV4cCI6MjExMTIyNzQxNX0.Z7xWXcxO9vwahvYtBpc3PZubZ9o8IZ5LEqmuVagpet4";

              @Override public void onReceive(Context c, Intent i) {
                  if (REFRESH.equals(i.getAction())) refresh(c, goAsync());
                  else super.onReceive(c, i);
              }

              // یک‌بار هنگام اضافه شدن ویجت؛ بعد از آن فقط با دکمه ریفرش (updatePeriodMillis = 0)
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  refresh(c, goAsync());
              }

              static void refresh(final Context c, final BroadcastReceiver.PendingResult pr) {
                  final SharedPreferences sp = c.getSharedPreferences("d", 0);
                  render(c, sp.getString("txt", "…"), sp.getString("arr", ""));
                  new Thread(() -> {
                      try {
                          long cur = Math.round(fetch());
                          long prev = sp.getLong("last", 0);
                          String arr = sp.getString("arr", "");
                          if (prev != 0 && cur > prev) arr = "U";
                          else if (prev != 0 && cur < prev) arr = "D";
                          String txt = fa(cur);
                          sp.edit().putLong("last", cur).putString("txt", txt).putString("arr", arr).apply();
                          render(c, txt, arr);
                      } catch (Exception e) {
                          render(c, "اتصال نشد", "");
                      } finally {
                          if (pr != null) pr.finish();
                      }
                  }).start();
              }

              static void render(Context c, String price, String arrow) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  int[] ids = m.getAppWidgetIds(new ComponentName(c, DollarWidget.class));
                  if (ids.length == 0) return;
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
                  int[] k = ink(c);
                  v.setImageViewBitmap(R.id.txt, draw(c, price, arrow, k[0], k[1]));
                  v.setInt(R.id.refresh, "setColorFilter", k[0]);
                  Intent in = new Intent(c, DollarWidget.class).setAction(REFRESH);
                  v.setOnClickPendingIntent(R.id.refresh, PendingIntent.getBroadcast(
                          c, 0, in, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                  m.updateAppWidget(ids, v);
              }

              // متن با فونت assets/font.ttf روی بیت‌مپ کشیده می‌شود (ویجت فونت سفارشی را مستقیم قبول نمی‌کند)
              static Bitmap draw(Context c, String price, String arrow, int fg, int sh) {
                  float d = c.getResources().getDisplayMetrics().density;
                  Typeface tf;
                  try { tf = Typeface.createFromAsset(c.getAssets(), "font.ttf"); }
                  catch (Exception e) { tf = Typeface.DEFAULT_BOLD; }
                  Paint pp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  pp.setTypeface(tf);
                  pp.setColor(fg);
                  pp.setTextSize(17 * d);
                  pp.setShadowLayer(3 * d, 0, 1 * d, sh);
                  Paint lp = new Paint(pp);
                  lp.setTextSize(11 * d);
                  lp.setColor((fg & 0x00FFFFFF) | 0xD9000000);
                  String label = "دلار";
                  float wp = pp.measureText(price), wl = lp.measureText(label);
                  float tri = arrow.isEmpty() ? 0 : 7 * d, gap = 8 * d;
                  float w = wp + gap + (tri > 0 ? tri + gap : 0) + wl;
                  int H = (int) (30 * d), W = (int) Math.ceil(w + 4 * d);
                  Bitmap b = Bitmap.createBitmap(W, H, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(b);
                  float x = 2 * d, cy = H / 2f;
                  Paint.FontMetrics fm = pp.getFontMetrics();
                  cv.drawText(price, x, cy - (fm.ascent + fm.descent) / 2f, pp);
                  x += wp + gap;
                  if (tri > 0) {
                      Path p = new Path();
                      if (arrow.equals("U")) {
                          p.moveTo(x, cy + tri / 3); p.lineTo(x + tri, cy + tri / 3); p.lineTo(x + tri / 2, cy - tri * 2 / 3);
                      } else {
                          p.moveTo(x, cy - tri / 3); p.lineTo(x + tri, cy - tri / 3); p.lineTo(x + tri / 2, cy + tri * 2 / 3);
                      }
                      p.close();
                      cv.drawPath(p, pp);
                      x += tri + gap;
                  }
                  Paint.FontMetrics fl = lp.getFontMetrics();
                  cv.drawText(label, x, cy - (fl.ascent + fl.descent) / 2f, lp);
                  return b;
              }

              // رنگ متن از روی رنگ‌های والپیپر انتخاب می‌شود (اندروید ۸٫۱ به بالا؛ در نسخه‌های قدیمی‌تر سفید)
              static int[] ink(Context c) {
                  int fg = 0xFFFFFFFF, sh = 0x66000000;
                  if (Build.VERSION.SDK_INT >= 27) {
                      try {
                          WallpaperColors wc = WallpaperManager.getInstance(c).getWallpaperColors(WallpaperManager.FLAG_SYSTEM);
                          if (wc != null) {
                              int bg = wc.getPrimaryColor().toArgb();
                              Color s = wc.getSecondaryColor() != null ? wc.getSecondaryColor() : wc.getTertiaryColor();
                              int acc = s != null ? s.toArgb() : bg;
                              float lum = (0.299f * Color.red(bg) + 0.587f * Color.green(bg) + 0.114f * Color.blue(bg)) / 255f;
                              boolean light = lum > 0.55f;
                              float[] hsv = new float[3];
                              Color.colorToHSV(acc, hsv);
                              if (hsv[1] >= 0.2f) {
                                  hsv[1] = light ? Math.min(0.95f, Math.max(0.55f, hsv[1])) : Math.min(0.75f, Math.max(0.3f, hsv[1]));
                              }
                              hsv[2] = light ? 0.28f : 0.97f;
                              fg = Color.HSVToColor(hsv);
                              sh = light ? 0x55FFFFFF : 0x66000000;
                          }
                      } catch (Exception e) { }
                  }
                  return new int[]{fg, sh};
              }

              static double fetch() throws Exception {
                  HttpURLConnection h = (HttpURLConnection) new URL(API).openConnection();
                  h.setConnectTimeout(8000);
                  h.setReadTimeout(8000);
                  h.setRequestProperty("apikey", KEY);
                  h.setRequestProperty("Authorization", "Bearer " + KEY);
                  int code = h.getResponseCode();
                  InputStream is = code >= 400 ? h.getErrorStream() : h.getInputStream();
                  BufferedReader r = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  String l;
                  while ((l = r.readLine()) != null) sb.append(l);
                  JSONObject j = new JSONObject(sb.toString());
                  if (!j.optBoolean("ok")) throw new Exception("api");
                  return j.getDouble("price");
              }

              static String fa(long n) {
                  String s = Long.toString(n);
                  StringBuilder b = new StringBuilder();
                  for (int i = 0; i < s.length(); i++) {
                      if (i > 0 && (s.length() - i) % 3 == 0) b.append('٬');
                      b.append((char) ('۰' + (s.charAt(i) - '0')));
                  }
                  return b.toString();
              }
          }
          EOF

      - name: Build
        run: cd proj && gradle assembleDebug --no-daemon
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk DollarPill.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest DollarPill.apk --repo "$GITHUB_REPOSITORY" --title "Dollar Pill" --notes "APK ویجت قرص دلار"
